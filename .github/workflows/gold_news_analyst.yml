name: Gold News Analyst

on:
  push:
    branches:
      - feat/gold-news-analyst-quality-v2
  pull_request:
  workflow_run:
    workflows:
      - "Gold News Bot"
      - "Gold News Breaking Monitor"
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview analysis without posting to Telegram"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gold-news-analyst-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyse:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run analyst unit tests
        run: python -m unittest discover -s tests -p "test_gold_news_analyst.py"
      - name: Run analyst
        env:
          GOLD_NEWS_ANALYST_BOT_TOKEN: ${{ secrets.GOLD_NEWS_ANALYST_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && 'false' || 'true' }}
          GOLD_NEWS_ANALYST_MAX_AGE_HOURS: "24"
          GOLD_NEWS_ANALYST_MIN_RELEVANCE: "0"
          GOLD_NEWS_ANALYST_MAX_ITEMS: "5"
          GOLD_NEWS_ANALYST_FETCH_ARTICLES: "true"
        run: python -m apps.gold_news_analyst
      - name: Save analyst delivery state
        if: success() && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true))
        env:
          TARGET_BRANCH: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_news_analyst_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Gold News Analyst delivery state"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${TARGET_BRANCH}"; then exit 0; fi
              echo "Push raced with another workflow; rebasing and retrying ($attempt/3)."
              git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
              git rebase "origin/${TARGET_BRANCH}"
            done
            echo "Could not publish analyst delivery state after 3 attempts."
            exit 1
          else
            echo "No analyst delivery state changes."
          fi
