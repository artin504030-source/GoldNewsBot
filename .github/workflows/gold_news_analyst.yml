name: Gold News Analyst

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview analysis without posting to Telegram"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gold-news-analyst-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run analyst
        env:
          GOLD_NEWS_ANALYST_BOT_TOKEN: ${{ secrets.GOLD_NEWS_ANALYST_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          GOLD_NEWS_ANALYST_MAX_AGE_HOURS: "24"
          GOLD_NEWS_ANALYST_MIN_RELEVANCE: "25"
          GOLD_NEWS_ANALYST_MAX_ITEMS: "2"
        run: python -m apps.gold_news_analyst
      - name: Save analyst delivery state
        if: success() && env.DRY_RUN != 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_news_analyst_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Gold News Analyst delivery state"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No analyst delivery state changes."
          fi
