name: Gold News Analyst

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview analysis without posting to Telegram"
        required: true
        type: boolean
        default: true
      max_items:
        description: "Maximum news items to process in this run"
        required: false
        type: number
        default: 5

permissions:
  contents: write

concurrency:
  group: gold-news-analyst-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run analyst
        env:
          GOLD_NEWS_ANALYST_BOT_TOKEN: ${{ secrets.GOLD_NEWS_ANALYST_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          GOLD_NEWS_ANALYST_MAX_AGE_HOURS: "24"
          GOLD_NEWS_ANALYST_MIN_RELEVANCE: "25"
          GOLD_NEWS_ANALYST_MAX_ITEMS: ${{ inputs.max_items || 5 }}
          GOLD_NEWS_ANALYST_FETCH_ARTICLES: "true"
        run: python -m apps.gold_news_analyst
      - name: Save analyst delivery state
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_news_analyst_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Gold News Analyst delivery state"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              echo "Push raced with another workflow; rebasing and retrying ($attempt/3)."
              git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
            done
            echo "Could not publish analyst delivery state after 3 attempts."
            exit 1
          else
            echo "No analyst delivery state changes."
          fi
