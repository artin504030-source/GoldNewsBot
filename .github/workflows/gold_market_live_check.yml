name: Gold Market Live Data Check

on:
  push:
    branches:
      - feat/gold-market-foundation
    paths:
      - "apps/gold_market/**"
      - ".github/workflows/gold_market_live_check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-data-check:
    name: Check external market data providers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and validate market observations
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m apps.gold_market
