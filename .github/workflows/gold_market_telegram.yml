name: Gold Market Telegram Delivery

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize dispatches so the hourly duplicate guard is checked safely.
concurrency:
  group: gold-market-telegram-delivery
  cancel-in-progress: false

jobs:
  deliver:
    name: Build and send Gold Market report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Define UTC delivery slot
        id: slot
        shell: bash
        run: echo "value=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: Restore hourly duplicate guard
        id: delivery-cache
        uses: actions/cache/restore@v4
        with:
          path: .gold-market-delivery-state
          key: gold-market-delivered-${{ steps.slot.outputs.value }}

      - name: Stop if this UTC hour was already delivered
        if: steps.delivery-cache.outputs.cache-hit == 'true'
        run: echo "Gold Market report already delivered for this UTC hour; skipping."

      - name: Generate and send Telegram report
        if: steps.delivery-cache.outputs.cache-hit != 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GOLD_MARKET_BOT_TOKEN: ${{ secrets.GOLD_MARKET_BOT_TOKEN }}
          GOLD_MARKET_CHAT_ID: ${{ secrets.GOLD_MARKET_CHAT_ID }}
        run: python -m apps.gold_market --send-telegram

      - name: Save hourly duplicate guard
        if: success() && steps.delivery-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .gold-market-delivery-state
          printf '%s\n' '${{ steps.slot.outputs.value }}' > .gold-market-delivery-state/sent

      - name: Persist successful delivery marker
        if: success() && steps.delivery-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .gold-market-delivery-state
          key: gold-market-delivered-${{ steps.slot.outputs.value }}
