name: Gold News Daily Digest

on:
  schedule:
    - cron: "30 15 * * *" # 20:00 Asia/Kabul (UTC+4:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without posting to Telegram"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gold-news-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: Send daily digest
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python daily_digest.py
