name: Sync Public Dashboard Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Validate news archive
        run: python -m json.tool news_archive.json > /dev/null

      - name: Check dashboard token
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_REPO_TOKEN" ]; then
            echo "Missing DASHBOARD_REPO_TOKEN. Add a fine-grained token with Contents: Read and write for GoldNewsDashboard only."
            exit 1
          fi

      - name: Checkout public dashboard
        uses: actions/checkout@v5
        with:
          repository: artin504030-source/GoldNewsDashboard
          ref: main
          path: dashboard-site
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}

      - name: Publish archive
        run: |
          cp news_archive.json dashboard-site/news_archive.json
          cd dashboard-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync latest public news archive"
            git push origin HEAD:main
          else
            echo "Public news archive is already up to date."
          fi
