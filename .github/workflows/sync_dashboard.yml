name: Sync Public Dashboard Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Validate public data files
        run: |
          python -m json.tool news_archive.json > /dev/null
          if [ -f daily_report.json ]; then python -m json.tool daily_report.json > /dev/null; fi

      - name: Check dashboard token
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_REPO_TOKEN" ]; then
            echo "Missing DASHBOARD_REPO_TOKEN."
            exit 1
          fi

      - name: Checkout public dashboard
        uses: actions/checkout@v5
        with:
          repository: artin504030-source/GoldNewsDashboard
          ref: main
          path: dashboard-site
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}

      - name: Publish archive and daily report
        run: |
          cp news_archive.json dashboard-site/news_archive.json
          if [ -f daily_report.json ]; then
            cp daily_report.json dashboard-site/daily_report.json
          fi
          cd dashboard-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_archive.json
          if [ -f daily_report.json ]; then git add daily_report.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Sync public Gold Intelligence data"
            git push origin HEAD:main
          else
            echo "Public dashboard data is already up to date."
          fi
