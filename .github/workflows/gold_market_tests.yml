name: Gold Market Foundation Tests

on:
  push:
    branches: [main, "feat/gold-market-foundation"]
    paths:
      - "apps/gold_market/**"
      - "tests/test_gold_market_foundation.py"
      - ".github/workflows/gold_market_tests.yml"
  pull_request:
    paths:
      - "apps/gold_market/**"
      - "tests/test_gold_market_foundation.py"
      - ".github/workflows/gold_market_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Gold Market foundation tests
        run: python -m unittest tests.test_gold_market_foundation -v
