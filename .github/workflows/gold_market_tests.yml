name: Gold Market Tests
on:
  push:
    branches: [main, "feat/gold-market-foundation"]
    paths: ["apps/gold_market/**", "tests/test_gold_market_*.py", ".github/workflows/gold_market_tests.yml"]
  pull_request:
    paths: ["apps/gold_market/**", "tests/test_gold_market_*.py", ".github/workflows/gold_market_tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_gold_market_*.py" -v
