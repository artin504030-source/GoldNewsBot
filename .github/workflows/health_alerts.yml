name: Gold News Health Alerts

on:
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run health checks without sending Telegram alerts or saving alert state"
        required: false
        type: boolean
        default: true
  workflow_run:
    workflows:
      - Gold News Bot
      - Gold News Breaking Monitor
      - Gold News Daily Digest
      - Gold Prices Bot
      - Gold Market Telegram Delivery
      - Gold News Analyst
      - Gold Reports Bot
      - Gold Priced-In Analyst
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: gold-news-health-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Check workflows and news sources; send deduplicated Telegram alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch') }}
        run: python monitor_health.py

      - name: Save alert state
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health_alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update health alert state"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              echo "Push raced with another repository update; rebasing and retrying ($attempt/3)."
              git fetch origin "+refs/heads/main:refs/remotes/origin/main"
              git rebase origin/main
            done
            echo "Could not publish health alert state after 3 attempts."
            exit 1
          else
            echo "Alert state is unchanged."
          fi
