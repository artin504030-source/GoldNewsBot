name: Gold News Health Alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gold-news-health-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Check workflows and news sources; send deduplicated Telegram alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python monitor_health.py

      - name: Save alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health_alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update health alert state"
            git push origin HEAD:main
          else
            echo "Alert state is unchanged."
          fi
