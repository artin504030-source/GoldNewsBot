name: Gold Prices Bot

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs; messages include provider timestamps.
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-prices-bot-main
  cancel-in-progress: false

jobs:
  gold-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gold Prices bot
        env:
          GOLD_PRICES_BOT_TOKEN: ${{ secrets.GOLD_PRICES_BOT_TOKEN }}
          GOLD_PRICES_CHANNEL_ID: ${{ secrets.GOLD_PRICES_CHANNEL_ID }}
        run: python -m apps.gold_prices.bot

      - name: Persist bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gold_prices/state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore(gold-prices): persist session state"
            git push origin HEAD:main
          fi
