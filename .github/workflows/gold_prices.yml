name: Gold Prices Bot

on:
  schedule:
    # Every 30 minutes, offset from the busy top-of-hour window.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      test_delivery:
        description: "Send a one-off Telegram delivery test message"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-prices-bot-main
  cancel-in-progress: false

jobs:
  gold-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Telegram delivery
        if: github.event_name == 'workflow_dispatch' && inputs.test_delivery == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GOLD_PRICES_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GOLD_PRICES_CHANNEL_ID }}
          TELEGRAM_TEST_LABEL: Gold Prices
          TELEGRAM_TEST_FOOTER: Gold Admin|Prices Admin
        run: python scripts/telegram_delivery_test.py

      - name: Run Gold Prices bot
        env:
          GOLD_PRICES_BOT_TOKEN: ${{ secrets.GOLD_PRICES_BOT_TOKEN }}
          GOLD_PRICES_CHANNEL_ID: ${{ secrets.GOLD_PRICES_CHANNEL_ID }}
        run: python -m apps.gold_prices.bot

      - name: Persist bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gold_prices/state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore(gold-prices): persist session state"
            git push origin HEAD:main
          fi

