name: Gold News Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test without posting to the Telegram channel"
        required: false
        type: boolean
        default: true
      breaking_only:
        description: "Run the priority-feed breaking-news scan only"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-news-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          BREAKING_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.breaking_only && 'true' || 'false' }}
        run: python news_bot.py

      - name: Send failure alert
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python health_alert.py

      - name: Save news history to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_news.json news_archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Update processed news history"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No news history changes to save."
          fi
      - name: Check dashboard sync token
        id: dashboard-token
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          if [ -n "$DASHBOARD_REPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dashboard sync skipped: add DASHBOARD_REPO_TOKEN to repository secrets."
          fi

      - name: Checkout public dashboard repository
        if: steps.dashboard-token.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: artin504030-source/GoldNewsDashboard
          ref: main
          path: dashboard-site
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}

      - name: Publish latest news archive to dashboard
        if: steps.dashboard-token.outputs.enabled == 'true'
        run: |
          cp news_archive.json dashboard-site/news_archive.json
          cd dashboard-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync latest public news archive"
            git push origin HEAD:main
          else
            echo "Public news archive is already up to date."
          fi

