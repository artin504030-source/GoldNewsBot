name: Gold News Health Monitor
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: gold-news-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  health-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test health monitor
        run: python -m unittest -v test_monitor_health.py
      - name: Check workflow health and notify on changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python monitor_health.py
      - name: Save alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update workflow health monitor state"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
