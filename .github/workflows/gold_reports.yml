name: Gold Reports Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily report, event monitor, or sample news"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - resend
          - monitor
          - test_news
          - test_pre_news
          - sessions
  schedule:
    # 09:00 Asia/Kabul (UTC+4:30), every day; Python chooses monthly/weekly/daily report by weekday.
    - cron: "30 4 * * 0-6"
    # Check session boundaries and high-impact releases every five minutes.
    # Offset from minute 0 to reduce GitHub Actions queue congestion.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gold-reports-bot
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated dependencies
        run: pip install -r gold_reports_requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile gold_reports.py
      - name: Run Gold Reports
        env:
          GOLD_REPORTS_BOT_TOKEN: ${{ secrets.GOLD_REPORTS_BOT_TOKEN }}
          GOLD_REPORTS_CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          REPORTS_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 4 * * 0-6' && 'daily' || 'monitor') }}
        run: python gold_reports.py
      - name: Persist deduplication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_reports_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Gold Reports delivery state"
            git push
          fi
