name: Gold Priced-In Analyst

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Analyze new reports or discard old pending Telegram updates"
        required: true
        default: "analyze"
        type: choice
        options:
          - analyze
          - discard_pending
  workflow_run:
    workflows: ["Gold Reports Bot"]
    types: [completed]
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: gold-priced-in-analyst
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests matplotlib
      - name: Run analyst unit tests
        run: python -m unittest tests/test_gold_priced_in_analyst.py
      - name: Run Priced-In Analyst
        env:
          GOLD_PRICED_IN_ANALYST_BOT_TOKEN: ${{ secrets.GOLD_PRICED_IN_ANALYST_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PRICED_IN_MODE: ${{ github.event.inputs.mode || 'analyze' }}
        run: |
          if [ -z "$GOLD_PRICED_IN_ANALYST_BOT_TOKEN" ]; then
            echo "Waiting for GOLD_PRICED_IN_ANALYST_BOT_TOKEN secret; bot is not activated yet."
            exit 0
          fi
          python -m apps.gold_priced_in_analyst
      - name: Save Telegram update offset
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_priced_in_analyst_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Save Gold Priced-In Analyst update offset"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
